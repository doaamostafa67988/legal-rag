[project]
name = "legal-rag"
version = "0.1.0"
description = "Bilingual Egyptian Civil Code RAG: parent-child retrieval, reranking and GraphRAG"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=1.7.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs the real e5 model (downloads ~0.5 GB); run with -m integration"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
