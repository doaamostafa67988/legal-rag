[project]
name = "legal-rag"
version = "0.1.0"
description = "Bilingual Egyptian Civil Code RAG: parent-child retrieval, reranking and GraphRAG"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
