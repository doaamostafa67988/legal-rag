# lint -> test -> build. The build job rebuilds the Chroma index, runs the faithfulness gate and,
# only if the gate passes, builds the Docker image and pushes it to Docker Hub.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# a newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1" # never change uv.lock in CI: a drifting lock file must fail, not be fixed silently
  DVC_NO_ANALYTICS: "1"
  ANONYMIZED_TELEMETRY: "False" # chromadb

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # same ruff as .pre-commit-config.yaml (v0.16.10): no need to install the project for this
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.10 check .
      - run: uvx ruff@0.16.10 format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      # the tests read the corpus, which lives in DVC (not in git): fetch just that file
      - uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-corpus-${{ hashFiles('dvc.lock') }}
      - run: uv run dvc pull -r gdrive data/processed/civil_code.json
      # coverage gate (70%) and the "not integration" filter come from pyproject.toml
      - run: uv run pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # only used if the judge cache misses
      # secrets are not available to pull requests from forks: those build, but do not push
      CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync

      # corpus + ONNX encoder come from DVC; the PDF is not needed to build the image
      - uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-corpus-onnx-${{ hashFiles('dvc.lock') }}
      - run: uv run dvc pull -r gdrive data/processed/civil_code.json models/e5-small-onnx

      # rebuild the Chroma index (the image ships it) with the same e5-small the experiments used
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - run: uv run python -m legal_rag.rag ingest

      # fails the job (exit 1) when mean faithfulness is below 0.75. Answers and judge scores come
      # from the committed cache (data/eval/faithfulness_cache.json), so this normally calls no LLM.
      - name: Faithfulness gate
        run: uv run python -m legal_rag.faithfulness --lang ar --threshold 0.75

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.CAN_PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/legal-rag
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
